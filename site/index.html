<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hall of Fame | VRChat</title>
  <style>
    :root { color-scheme: dark; --bg:#0a0b10; --panel:#141720; --line:#292e3b; --muted:#a2a8b8; --gold:#e4bd68; --white:#f4f5f8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(ellipse at top,#1b2030 0,#0a0b10 54%); color:var(--white); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    .wrap { width:min(1060px,calc(100% - 32px)); margin:0 auto; padding:52px 0 60px; }
    header { text-align:center; margin-bottom:30px; }
    .eyebrow { color:var(--gold); letter-spacing:.28em; font-size:.75rem; font-weight:800; }
    h1 { margin:8px 0 4px; font-size:clamp(2.3rem,7vw,4.7rem); letter-spacing:.08em; line-height:1.05; }
    .subtitle { margin:0; color:var(--muted); }
    .tabs { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin:28px 0 18px; }
    button { background:#171b25; color:#d9dce5; border:1px solid var(--line); border-radius:999px; padding:11px 20px; font-weight:700; cursor:pointer; }
    button[aria-selected="true"] { background:var(--gold); color:#17130b; border-color:var(--gold); }
    .board { background:linear-gradient(180deg,#171b25,#10131a); border:1px solid var(--line); border-radius:20px; overflow:hidden; box-shadow:0 22px 65px #0007; }
    .board-head { padding:23px 24px 14px; display:flex; align-items:end; justify-content:space-between; gap:12px; }
    h2 { margin:0; font-size:1.35rem; }
    #updated { color:var(--muted); font-size:.8rem; }
    .rows { padding:0 14px 14px; }
    .entry { display:grid; grid-template-columns:54px minmax(0,1fr) auto; align-items:center; gap:14px; padding:14px 12px; border-top:1px solid #ffffff0d; }
    .rank { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:#252b39; color:var(--gold); font-weight:900; }
    .name { font-weight:800; overflow-wrap:anywhere; }
    .id { color:var(--muted); font-size:.73rem; }
    .score { color:var(--gold); font-weight:900; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .empty,.error { margin:12px; padding:24px; border:1px dashed var(--line); border-radius:14px; text-align:center; color:var(--muted); }
    footer { text-align:center; color:var(--muted); font-size:.78rem; margin-top:18px; }
    @media(max-width:520px){ .wrap{padding-top:34px}.entry{grid-template-columns:42px minmax(0,1fr) auto;gap:8px}.rank{width:34px;height:34px}.board-head{align-items:start;flex-direction:column} }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="eyebrow">VRCHAT · COMPETITIVE LEADERBOARD</div>
      <h1>HALL OF FAME</h1>
      <p class="subtitle">Los 10 mejores jugadores. Cada puesto cuenta.</p>
    </header>
    <nav class="tabs" aria-label="Categorías">
      <button data-board="global" aria-selected="true">Global</button>
      <button data-board="parkour" aria-selected="false">Parkour</button>
      <button data-board="alternatives" aria-selected="false">Alternativas</button>
    </nav>
    <section class="board">
      <div class="board-head">
        <h2 id="board-title">Top 10 Global</h2>
        <span id="updated">Cargando ranking…</span>
      </div>
      <div class="rows" id="rows" aria-live="polite"></div>
    </section>
    <footer>El ranking conserva como máximo 10 registros en cada categoría.</footer>
  </main>
  <script>
    const titles = { global: "Top 10 Global", parkour: "Top 10 Parkour · Menor tiempo", alternatives: "Top 10 Alternativas" };
    let activeBoard = "global";
    let ranking = null;

    function scoreFor(board, player) {
      if (board === "parkour") return Number(player.timeSeconds).toFixed(2) + " s";
      if (board === "alternatives") return Number(player.alternativesScore || 0).toFixed(0) + " pts";
      return Number(player.globalScore || 0).toFixed(0) + " pts";
    }

    function render() {
      const list = ranking && Array.isArray(ranking[activeBoard]) ? ranking[activeBoard] : [];
      document.getElementById("board-title").textContent = titles[activeBoard];
      const rows = document.getElementById("rows");
      rows.replaceChildren();
      if (!list.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Todavía no hay puntuaciones publicadas.";
        rows.appendChild(empty);
        return;
      }
      list.forEach((player, i) => {
        const entry = document.createElement("div"); entry.className = "entry";
        const rank = document.createElement("div"); rank.className = "rank"; rank.textContent = String(i + 1);
        const details = document.createElement("div");
        const name = document.createElement("div"); name.className = "name"; name.textContent = player.playerName || "Jugador";
        const id = document.createElement("div"); id.className = "id"; id.textContent = player.playerId || "";
        details.append(name, id);
        const score = document.createElement("div"); score.className = "score"; score.textContent = scoreFor(activeBoard, player);
        entry.append(rank, details, score); rows.appendChild(entry);
      });
    }

    async function loadRanking() {
      try {
        const response = await fetch("./ranking.json?cache=" + Date.now(), { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        ranking = await response.json();
        const stamp = ranking.updatedAt ? new Date(ranking.updatedAt).toLocaleString("es-CL") : "sin actualizar";
        document.getElementById("updated").textContent = "Actualizado: " + stamp;
        render();
      } catch (error) {
        const rows = document.getElementById("rows");
        rows.textContent = "No se pudo cargar ranking.json: " + error.message;
        rows.className = "error";
      }
    }

    document.querySelectorAll("button[data-board]").forEach(button => {
      button.addEventListener("click", () => {
        activeBoard = button.dataset.board;
        document.querySelectorAll("button[data-board]").forEach(b => b.setAttribute("aria-selected", String(b === button)));
        render();
      });
    });
    loadRanking();
  </script>
</body>
</html>
